spring:
  application:
    name: money-transfer-service
  mvc:
    apiversion:
      # API version taken from the first path segment (e.g. /v1/accounts -> version 1)
      use:
        path-segment: 0
  jpa:
    hibernate:
      # The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities
      ddl-auto: validate
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: ${spring.application.name}
      # Never skip transfers published before the consumer group first joined (duplicates are handled idempotently)
      auto-offset-reset: earliest
      # Values are read as raw bytes and converted to the listener payload by the message converter (KafkaConfig),
      # so a record that cannot be processed is forwarded unchanged to the dead-letter topic
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      # The only producer is the dead-letter publisher, which forwards the original record bytes
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

app:
  kafka:
    topic:
      transfer: money-transfers
      transfer-dead-letter: money-transfers.DLT
    # Retries of transfers failing with a transient error (e.g. database unavailable) before they are dead-lettered.
    # Malformed or invalid events are never retried.
    retry:
      initial-interval: 1s
      multiplier: 2
      max-interval: 30s
      max-retries: 6
